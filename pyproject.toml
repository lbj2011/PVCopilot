[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pvcopilot"
version = "0.1.0"
description = "PV-Copilot: LLM-assisted, end-to-end PV degradation-rate analysis (Python API + local web UI)"
readme = "README.md"
license = "BSD-2-Clause"          # to be confirmed by the LBNL IPO
license-files = ["LICENSE"]
authors = [{ name = "Baojie Li", email = "BaojieLi@lbl.gov" },
           { name = "Anubhav Jain" }]
requires-python = ">=3.10,<3.12"   # rdtools 2.1.8 pins pandas<2.1 (no wheels for 3.12+)
keywords = ["photovoltaics", "degradation", "rdtools", "pvlib", "LLM", "PV-Copilot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
# Pins follow the pvtools.lbl.gov deployment (rdtools 2.1.8 needs pvlib<0.11, pandas<2.1).
dependencies = [
    "numpy>=1.24,<2",
    "pandas>=2.0,<2.1",
    "scipy>=1.11,<1.14",
    "pvlib>=0.9.5,<0.11",
    "rdtools==2.1.8",
    "pvanalytics==0.2.2",
    "ruptures>=1.1",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "plotly>=5.20",
    "pyarrow>=14",
    "openpyxl>=3.1",
    "openai>=1.62",
    "python-dotenv>=1.0",
    "setuptools<81",          # rdtools 2.1.8 still imports pkg_resources
    "dash>=3.0",
    "dash-bootstrap-components>=1.6",
    "dash-mantine-components==2.8.0",
    "diskcache>=5.6",
]

[project.optional-dependencies]
images = ["kaleido>=0.2"]   # Result.save_figures(fmt="png")
dev = ["pytest>=7"]

[project.scripts]
pvcopilot = "pvcopilot.cli:main"

[project.urls]
Homepage = "https://github.com/lbj2011/PVCopilot"
Documentation = "https://github.com/lbj2011/PVCopilot#readme"
Issues = "https://github.com/lbj2011/PVCopilot/issues"
"Web app" = "https://pvtools.lbl.gov/pv-copilot"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pvcopilot = ["data/*.csv", "data/examples/*.parquet",
             "core/*.txt",
             "app/*.md", "app/assets/*", "app/assets/*/*"]
