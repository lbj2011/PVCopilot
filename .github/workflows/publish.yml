# Publishes to PyPI when a GitHub release is published (e.g. tag v0.1.0).
# Uses PyPI "Trusted Publishing": no API token is stored anywhere.
# One-time setup on pypi.org -> Account -> Publishing -> Add a pending publisher:
#   project name: pvcopilot   owner: lbj2011   repository: PVCopilot
#   workflow: publish.yml     environment: pypi
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:        # manual run: publishes to TestPyPI only

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
